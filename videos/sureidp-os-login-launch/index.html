    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const wraps = {};
      for (let i = 1; i <= 10; i++) {
        wraps[i] = document.getElementById("wrap-" + i);
      }

      // Standard 0.4s opacity crossfades at every boundary except 2->3
      const boundaries = [
        { from: 1, to: 2, at: 11.0 },
        // 2->3 handled separately below (zoom-blur climax)
        { from: 3, to: 4, at: 40.0 },
        { from: 4, to: 5, at: 68.5 },
        { from: 5, to: 6, at: 87.5 },
        { from: 6, to: 7, at: 106.0 },
        { from: 7, to: 8, at: 131.5 },
        { from: 8, to: 9, at: 166.5 },
        { from: 9, to: 10, at: 180.5 },
      ];

      boundaries.forEach(function (b) {
        const T = b.at;
        tl.to(wraps[b.from], { opacity: 0, duration: 0.4, ease: "power1.inOut" }, T - 0.4);
        tl.fromTo(
          wraps[b.to],
          { opacity: 0 },
          { opacity: 1, duration: 0.4, ease: "power1.inOut" },
          T - 0.4
        );
      });

      // 2 -> 3 climax: zoom-through + blur (the product reveal)
      const T2 = 24.5;
      tl.to(wraps[2], { scale: 1.2, filter: "blur(20px)", opacity: 0, duration: 0.2, ease: "power3.in", transformOrigin: "50% 50%" }, T2 - 0.2);
      tl.fromTo(
        wraps[3],
        { scale: 0.85, filter: "blur(20px)", opacity: 0 },
        { scale: 1, filter: "blur(0px)", opacity: 1, duration: 0.4, ease: "expo.out", transformOrigin: "50% 50%" },
        T2 - 0.1
      );

      window.__timelines["main"] = tl;
    </script>
