<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          background: #f5f8fb;
          overflow: hidden;
          font-family: "Montserrat", sans-serif;
        }
        .frame-outline {
          position: absolute;
          border: 2px solid rgba(0,119,255,0.10);
          border-radius: 16px;
        }
        #fo1 { width: 420px; height: 280px; top: 110px; left: 140px; transform: rotate(-4deg); }
        #fo2 { width: 380px; height: 260px; top: 640px; left: 1360px; transform: rotate(5deg); }
        #fo3 { width: 300px; height: 220px; top: 90px; left: 1480px; transform: rotate(-3deg); }
        .beatline {
          position: absolute;
          left: 180px;
          right: 180px;
          top: 50%;
          transform: translateY(-50%);
          text-align: center;
          font-weight: 800;
          font-size: 88px;
          line-height: 1.2;
          letter-spacing: -0.02em;
          color: #12161c;
          opacity: 0;
        }
        .beatline .accent { color: #0062cc; }
        #os-token { color: #0062cc; }
      </style>
      <div id="root" data-composition-id="scene-02-problem" data-width="1920" data-height="1080" data-duration="14.3">
        <div class="frame-outline" id="fo1"></div>
        <div class="frame-outline" id="fo2"></div>
        <div class="frame-outline" id="fo3"></div>

        <div class="beatline" id="beat-os"><span id="os-token">WINDOWS</span> logs in its own way.</div>
        <div class="beatline" id="beat-local">Local passwords.<br />Nobody resets them.</div>
        <div class="beatline" id="beat-policy">No shared policy.</div>
        <div class="beatline" id="beat-final">No visibility &mdash;<br /><span class="accent">until something goes wrong.</span></div>
      </div>
      <script>
        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true });

        // three misaligned frame outlines drift very slightly (idle ambient, fragmentation motif)
        tl.to("#fo1", { rotation: -2, duration: 6, ease: "sine.inOut", repeat: 1, yoyo: true }, 0);
        tl.to("#fo2", { rotation: 7, duration: 7, ease: "sine.inOut", repeat: 1, yoyo: true }, 0);
        tl.to("#fo3", { rotation: -1, duration: 5, ease: "sine.inOut", repeat: 1, yoyo: true }, 0);

        // Beat 1 (sub-shape A: fixed line, OS token hard-cut swap)
        tl.fromTo("#beat-os", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 0.3);
        tl.set("#os-token", { textContent: "WINDOWS" }, 0.3);
        tl.set("#os-token", { textContent: "MACOS" }, 1.83);
        tl.set("#os-token", { textContent: "LINUX" }, 3.36);
        tl.to("#beat-os", { opacity: 0, duration: 0.2, ease: "power1.in" }, 4.78);

        // Beat 2 — local passwords
        tl.fromTo("#beat-local", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 4.98);
        tl.to("#beat-local", { opacity: 0, duration: 0.2 }, 7.27);

        // Beat 3 — no shared policy
        tl.fromTo("#beat-policy", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 7.47);
        tl.to("#beat-policy", { opacity: 0, duration: 0.2 }, 8.64);

        // Beat 4 (final, holds — the pain stays on screen)
        tl.fromTo("#beat-final", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 8.84);

        window.__timelines["scene-02-problem"] = tl;
      </script>
    </template>
  </body>
</html>
