<!doctype html>
<html lang="en">

    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          background: #f5f8fb;
          overflow: hidden;
          font-family: "Montserrat", sans-serif;
        }
        .eyebrow {
          position: absolute;
          top: 64px; left: 0; right: 0;
          text-align: center;
          font-family: "IBM Plex Mono", monospace;
          font-size: 22px; font-weight: 600; letter-spacing: 0.14em;
          color: #0062cc;
          opacity: 0;
        }
        .stage {
          position: absolute; top: 130px; left: 272px; width: 1375px;
        }
        .shotcard {
          width: 1375px; border-radius: 14px;
          border: 1px solid rgba(0,119,255,0.18);
          box-shadow: 0 26px 64px rgba(27,37,48,0.15);
          overflow: hidden; background: #fff;
          opacity: 0; transform: scale(0.96);
        }
        .shotcard img { display: block; width: 100%; height: auto; }
        .focusring {
          position: absolute; border: 3px solid #0077ff; border-radius: 10px;
          opacity: 0; box-shadow: 0 0 0 6px rgba(0,119,255,0.14);
        }
        .caption {
          position: absolute; bottom: 54px; left: 0; right: 0; text-align: center;
          font-weight: 700; font-size: 38px; color: #12161c; opacity: 0;
        }
        .caption .accent { color: #0062cc; }
        .cursor { position: absolute; width: 34px; height: 34px; top: -80px; left: -80px; z-index: 20; }
        .cursor .outline, .cursor .fill { position: absolute; inset: 0;
          clip-path: polygon(2px 1px, 2px 26px, 10px 20px, 15px 30px, 20px 27px, 15px 18px, 24px 18px); }
        .cursor .outline { background: #1b2530; transform: scale(1.18); transform-origin: 4px 2px; }
        .cursor .fill { background: #ffffff; }

        .deniedwrap {
          position: absolute; inset: 0; opacity: 0;
        }
        .deniedwrap img {
          position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
        }
        .timer60 {
          position: absolute; top: 40px; left: 50%; transform: translateX(-50%) scale(0.5);
          font-family: "IBM Plex Mono", monospace; font-weight: 700;
          color: #fff; text-align: center; opacity: 0;
          background: rgba(11,20,32,0.55);
          border-radius: 20px;
          padding: 18px 40px;
        }
        .timer60 .num { font-size: 100px; line-height: 1; display: block; }
        .timer60 .unit { font-size: 22px; letter-spacing: 0.16em; opacity: 0.85; }
        .finalcaption {
          position: absolute; bottom: 90px; left: 0; right: 0; text-align: center;
          font-weight: 800; font-size: 56px; color: #fff; opacity: 0;
          text-shadow: 0 4px 24px rgba(0,0,0,0.35);
        }
      </style>
      <div id="root" data-composition-id="scene-07-conditional" data-width="1920" data-height="1080" data-duration="26.3">

            <img src="assets/screenshots/07-config-conditional-access-section.png" />

        tl.to("#eyebrow", { opacity: 0, duration: 0.15 }, 15.89);
        tl.set("#stage", { opacity: 0 }, 16.19);

        tl.fromTo("#timer", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.8)" }, 16.4);
        tl.to("#timer", { opacity: 0, duration: 0.3 }, 19.3);
        tl.fromTo("#cap-final", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4 }, 20.9);

        window.__timelines["scene-07-conditional"] = tl;
      </script>
    </template>

</html>
