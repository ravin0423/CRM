          height: 230px;
          border-radius: 16px;
          background: rgba(0,119,255,0.045);
          border: 1.5px solid rgba(0,119,255,0.18);

          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 16px;
          opacity: 0;
          transform: scale(0.7);

        .card svg { width: 56px; height: 56px; }
        .card .label {
          font-size: 22px;
          font-weight: 700;
          color: #12161c;
          text-align: center;

          bottom: 66px;

          right: 0;
          text-align: center;
          font-size: 34px;
          font-weight: 700;
          color: #5b6675;
          opacity: 0;
        }
        .closing .accent { color: #0062cc; }
      </style>
      <div id="root" data-composition-id="scene-05-branding" data-width="1920" data-height="1080" data-duration="19.8">
        <div class="eyebrow" id="eyebrow">BRANDING</div>

        <div class="card" id="c-logo" style="top:250px;left:575px;">
          <svg viewBox="0 0 24 24" fill="none" stroke="#0077ff" stroke-width="1.6"><rect x="3" y="4" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M3 16l5-4 4 3 4-5 5 6"/></svg>

      <script>
        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true });

        tl.fromTo("#eyebrow", { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.4 }, 0.2);

        // Row 1 — branding cards cascade (stagger <=500ms cap)
        tl.fromTo(["#c-logo", "#c-wallpaper", "#c-message"],
          { opacity: 0, scale: 0.7, y: 24 },
          { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: "back.out(1.6)", stagger: 0.15 },

        tl.to("#eyebrow", { opacity: 0, duration: 0.25 }, 6.9);
        tl.set("#eyebrow", { textContent: "LOGIN SCREEN CONTROLS" }, 7.15);
        tl.to("#eyebrow", { opacity: 1, duration: 0.3 }, 7.15);

        // Row 2 — control cards cascade in two waves (restart/sleep, then shutdown/wifi)
        tl.fromTo(["#c-restart", "#c-sleep"],
          { opacity: 0, scale: 0.7, y: 24 },
          { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: "back.out(1.6)", stagger: 0.15 },
          7.4
        );
        tl.fromTo(["#c-shutdown", "#c-wifi"],
          { opacity: 0, scale: 0.7, y: 24 },
          { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: "back.out(1.6)", stagger: 0.15 },
          11.2
        );

        tl.fromTo("#closing", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5 }, 13.7);

        window.__timelines["scene-05-branding"] = tl;
      </script>
