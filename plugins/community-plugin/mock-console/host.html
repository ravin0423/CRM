<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Mock SureMDM Console</title>
<style>
  body { font-family: sans-serif; margin: 0; display: flex; height: 100vh; }
  nav { width: 220px; background: #111827; color: #fff; padding: 16px; flex-shrink: 0; }
  nav .item { padding: 8px 12px; border-radius: 6px; margin-bottom: 4px; }
  nav .item.active { background: #0a66c2; }
  main { flex: 1; display: flex; flex-direction: column; }
  header { padding: 12px 16px; border-bottom: 1px solid #e5e7eb; font-weight: 600; }
  .frame-wrap { flex: 1; }
  iframe.plugin-frame { width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
  <nav>
    <div class="item">Devices</div>
    <div class="item">Apps</div>
    <div class="item active">42Gears Community</div>
    <div class="item">Reports</div>
  </nav>
  <main>
    <header>42Gears Community (plugin)</header>
    <div class="frame-wrap">
      <iframe class="plugin-frame" src="../public/index.html" title="42Gears Community Plugin"></iframe>
    </div>
  </main>

  <script>
    // Stand-in for the real SPDK host runtime: answers the plugin's
    // handshake with a fake session token, and logs resize pings.
    const pluginFrame = document.querySelector(".plugin-frame");

    window.addEventListener("message", (event) => {
      const data = event.data;
      if (!data) return;

      if (data.type === "spdk:ready") {
        pluginFrame.contentWindow.postMessage(
          {
            type: "spdk:context",
            payload: {
              sessionToken: "mock-session-token-123",
              user: { email: "demo.user@example.com", name: "Demo User" },
              theme: "light",
            },
          },
          "*"
        );
      }

      if (data.type === "spdk:resize") {
        console.log("[mock console] plugin resized to", data.height);
      }
    });
  </script>
</body>
</html>
